<!doctype html>
<!-- Graph explorer page template (FTR-TRC-014; ADR-TRC-025: DEC-TRC-084, DEC-TRC-088; RQ-TRC-145, RQ-TRC-148, RQ-TRC-155).
     graph.py --explorer replaces the markers: tokens, style, libraries, script, title, data script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
/*@TOKENS@*/
/*@CSS@*/
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="brand">
      <!-- RQ-TRC-114, DEC-TRC-056 (copied): the AGNOS brand mark "Spans", as the performance center draws it -->
      <svg class="brand-mark" viewBox="0 0 24 24" role="img" aria-label="AGNOS"><rect class="mark-tile" width="24" height="24" rx="5.5"></rect><rect class="mark-bar-light" x="4" y="3" width="16" height="3" rx="1"></rect><rect class="mark-bar-blue" x="4" y="8" width="6" height="3" rx="1"></rect><rect class="mark-bar-green" x="10" y="13" width="5" height="3" rx="1"></rect><rect class="mark-bar-yellow" x="15" y="18" width="5" height="3" rx="1"></rect></svg>
      <h1>Graph explorer</h1>
    </div>
    <!-- RQ-GXP-001, DEC-GXP-001: the menu bar, filled by the script from its list of menus -->
    <div id="menubar" class="menubar" role="menubar" aria-label="Menus"></div>
    <p id="graph-meta" class="graph-meta"></p>
    <input id="file-input" aria-label="Graph file" title="Choose an agnos-graph.json file" type="file" accept=".json,application/json" class="visually-hidden">
    <p id="load-message" class="load-message" role="status" aria-live="polite"></p>
  </header>
  <aside id="facets" class="panel" aria-label="Facets">
    <section class="panel-section">
      <h2 class="panel-title">Graph</h2>
      <dl id="graph-summary" class="summary"></dl>
    </section>
    <div id="facet-list"></div>
  </aside>
  <div id="split-left" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the facets panel" aria-controls="facets"></div>
  <main id="main">
    <section class="query-bar" aria-label="Query">
      <div class="query-row">
        <label for="query" class="query-label">Query</label>
        <input id="query" title="Type a query, then press Enter or Run; click a facet value while this field is focused to write its term" type="text" spellcheck="false" autocomplete="off"
               placeholder="type:RQ tri:TRC status:!Done   ·   type:RQ !cited-by:TASK[Requirement refs]   ·   edge kind:refs field:text">
        <button type="button" class="button button-primary" id="query-run" title="Run the query in every view">Run</button>
        <button type="button" class="button" id="query-clear" title="Clear the query and show what the facets allow">Clear</button>
      </div>
      <div id="saved-queries" class="saved-queries" aria-label="Saved queries"></div>
      <input id="saved-import-file" title="Choose an exported file of saved queries" type="file" accept=".json,application/json" class="visually-hidden" aria-label="Import saved queries">
      <p id="query-message" class="query-message" role="status" aria-live="polite"></p>
    </section>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" class="tab" data-view="graph" id="tab-graph" title="Show the graph of the shown nodes and relations">Graph</button>
        <button type="button" role="tab" class="tab" data-view="nodes" id="tab-nodes" title="Show the table of the shown nodes">Nodes</button>
        <button type="button" role="tab" class="tab" data-view="relations" id="tab-relations" title="Show the table of the shown relations">Relations</button>
      </div>
      <div class="graph-controls">
        <button type="button" class="button graph-control" id="graph-zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
        <button type="button" class="button graph-control" id="graph-zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" class="button graph-control" id="graph-fit" title="Fit the shown nodes to the view">Fit</button>
        <!-- RQ-TRC-162, DEC-TRC-094: the automatic layouts -->
        <label class="query-label graph-control" for="graph-layout">Layout</label>
        <select id="graph-layout" class="select graph-control" title="Arrange the shown nodes with an automatic layout">
          <option value="columns">Type columns</option><option value="grid">Grid</option><option value="circle">Circle</option>
          <option value="concentric">Concentric</option><option value="breadthfirst">Tree</option><option value="cose">Force-directed</option>
        </select>
        <!-- RQ-TRC-166, DEC-TRC-094: the direction of the layouts that have one -->
        <select id="graph-direction" class="select graph-control" aria-label="Layout direction" title="Arrange the type columns, tree and grid layouts left to right or top to bottom">
          <option value="lr">Left to right</option><option value="tb">Top to bottom</option>
        </select>
        <button type="button" class="button" id="show-all" title="Check every facet value, clear the query, the hidden nodes and the isolation">Show all</button>
      </div>
      <p id="view-count" class="view-count"></p>
    </div>
    <div id="hidden-list" class="hidden-list" aria-live="polite"></div>
    <section id="view-graph" class="view" role="tabpanel" aria-labelledby="tab-graph">
      <div id="graph" class="graph-canvas"></div>
      <!-- RQ-TRC-163, DEC-TRC-095: the graph's context menu, filled when it opens -->
      <div id="graph-menu" class="graph-menu" role="menu" aria-label="Graph actions" hidden></div>
      <!-- RQ-TRC-167: the hovered node's tooltip, filled when it opens -->
      <div id="graph-tip" class="graph-tip" role="tooltip" hidden></div>
      <!-- RQ-TRC-165: the legend of the node types and relation kinds present, filled from the graph -->
      <aside id="graph-legend" class="graph-legend" aria-label="Legend">
        <button type="button" class="legend-toggle" aria-expanded="true" title="Fold or unfold the legend">Legend</button>
        <div class="legend-body"></div>
      </aside>
    </section>
    <section id="view-nodes" class="view" role="tabpanel" aria-labelledby="tab-nodes">
      <div class="table-scroll">
        <table id="node-table" class="data-table">
          <thead><tr>
            <th scope="col" data-key="id">ID</th><th scope="col" data-key="type">Type</th><th scope="col" data-key="tri">Trigram</th>
            <th scope="col" data-key="status">Status</th><th scope="col" data-key="title">Title</th>
            <th scope="col" data-key="location">Location</th><th scope="col" data-key="incoming">In</th><th scope="col" data-key="outgoing">Out</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <section id="view-relations" class="view" role="tabpanel" aria-labelledby="tab-relations">
      <div class="table-scroll">
        <table id="relation-table" class="data-table">
          <thead><tr>
            <th scope="col" data-key="source">Source</th><th scope="col" data-key="target">Target</th><th scope="col" data-key="kind">Kind</th>
            <th scope="col" data-key="field">Field</th><th scope="col" data-key="line">Line</th><th scope="col" data-key="proof">Proof</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="split-right" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the detail panel" aria-controls="detail"></div>
  <aside id="detail" class="panel" aria-label="Detail" aria-live="polite"></aside>
</div>
<div id="drop-zone" class="drop-zone" hidden><p>Drop a graph file to explore it</p></div>
@LIBRARIES@
<script id="default-queries" type="application/json">@PRESETS@</script>
<script src="@DATA_SCRIPT@"></script>
<script>
/*@SCRIPT@*/
</script>
</body>
</html>
