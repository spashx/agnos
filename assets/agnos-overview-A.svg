<?xml version="1.0" encoding="UTF-8"?>
<!-- Proposal A "The supervised loop". Source of the README overview image (RQ-PLG-047 / TASK-PLG-078). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" width="1536" height="1024">
  <title>AGNOS - Agentic efficiency by traceability</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Condensed:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
      text{font-family:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;fill:#0F172A}
      .d{font-family:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",sans-serif}
      .m{font-family:"IBM Plex Mono",Consolas,Menlo,monospace}
      .md{font-weight:500}.b{font-weight:600}.bb{font-weight:700}
      .mu{fill:#475569}.su{fill:#64748B}.ac{fill:#2563EB}.ag{fill:#B45309}.wh{fill:#FFFFFF}
      .i{fill:none;stroke:#0F172A;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
      .ib{stroke:#2563EB}.ia{stroke:#B45309}.iw{stroke:#FFFFFF}.im{stroke:#475569}
      .hl{stroke:#E2E8F0;stroke-width:1}
      .node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .card{fill:#F8FAFC;stroke:#E2E8F0}
    </style>
    <g id="logo"><rect width="24" height="24" rx="5.5" fill="#3C4043"/><rect x="4" y="3" width="16" height="3" rx="1" fill="#E8EAED"/><rect x="4" y="8" width="6" height="3" rx="1" fill="#4285F4"/><rect x="10" y="13" width="5" height="3" rx="1" fill="#34A853"/><rect x="15" y="18" width="5" height="3" rx="1" fill="#FBBC05"/></g>
    <g id="i-req"><path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/></g>
    <g id="i-dec"><path d="M12 21v-6M12 15c0-4-6-3-6-8M12 15c0-4 6-3 6-8"/><circle cx="6" cy="5" r="2"/><circle cx="18" cy="5" r="2"/></g>
    <g id="i-task"><path d="M9 4h6v3H9zM9 5.5H6V21h12V5.5h-3M9.5 12h5M9.5 16h3"/></g>
    <g id="i-you"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></g>
    <g id="i-code"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g>
    <g id="i-done"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></g>
    <g id="i-commit"><circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/></g>
    <g id="i-agent"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V5M9.5 13v1M14.5 13v1"/><circle cx="12" cy="4" r="1"/></g>
    <g id="i-pc"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7.5 13v-2M12 13V8M16.5 13v-3.5"/></g>
    <g id="i-link"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g>
    <g id="i-index"><path d="M4 6h1M9 6h11M4 12h1M9 12h11M4 18h1M9 18h11"/></g>
    <g id="i-gate"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
    <g id="i-cycle"><path d="M20 12a8 8 0 0 1-14.5 4.7M4 12a8 8 0 0 1 14.5-4.7M18.5 3v4.3h-4.3M5.5 21v-4.3h4.3"/></g>
    <g id="i-branch"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10a6 6 0 0 1-6 6H8"/></g>
    <g id="t-matrix"><rect width="96" height="6" rx="1" fill="#CBD5E1"/>
      <g fill="#94A3B8"><rect y="12" width="21" height="9" rx="1"/><rect y="25" width="21" height="9" rx="1"/><rect y="38" width="21" height="9" rx="1"/><rect y="51" width="21" height="9" rx="1"/></g>
      <g fill="#2563EB"><rect x="25" y="12" width="21" height="9" rx="1"/><rect x="50" y="12" width="21" height="9" rx="1"/><rect x="75" y="12" width="21" height="9" rx="1"/><rect x="25" y="25" width="21" height="9" rx="1"/><rect x="50" y="25" width="21" height="9" rx="1"/><rect x="75" y="25" width="21" height="9" rx="1"/><rect x="25" y="38" width="21" height="9" rx="1"/><rect x="75" y="38" width="21" height="9" rx="1"/><rect x="25" y="51" width="21" height="9" rx="1"/><rect x="50" y="51" width="21" height="9" rx="1"/><rect x="75" y="51" width="21" height="9" rx="1"/></g>
      <rect x="50.75" y="38.75" width="19.5" height="7.5" rx="1" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/></g>
    <g id="t-graph"><g stroke="#CBD5E1" stroke-width="1.5"><path d="M48 30L12 12M48 30L14 50M48 30L82 10M48 30l38 5M48 30l28 24M86 35L76 54" fill="none"/></g><g fill="#94A3B8"><circle cx="12" cy="12" r="4.5"/><circle cx="14" cy="50" r="4.5"/><circle cx="82" cy="10" r="4.5"/><circle cx="86" cy="35" r="4.5"/><circle cx="76" cy="54" r="4.5"/></g><circle cx="48" cy="30" r="8" fill="#2563EB"/></g>
    <g id="t-history"><path d="M0 12h96M0 30h96M0 48h96" stroke="#CBD5E1" stroke-width="1.5"/><g fill="#2563EB"><circle cx="10" cy="12" r="5"/><circle cx="58" cy="12" r="5"/><circle cx="34" cy="48" r="5"/></g><g fill="#B45309"><circle cx="26" cy="30" r="5"/><circle cx="44" cy="30" r="5"/><circle cx="74" cy="30" r="5"/><circle cx="86" cy="48" r="5"/></g><g fill="#7C3AED"><circle cx="84" cy="12" r="5"/><circle cx="60" cy="48" r="5"/></g></g>
    <g id="t-delivery"><path d="M0 59.5h96" stroke="#CBD5E1"/><g fill="#2563EB"><rect x="3" y="44" width="11" height="15" rx="1"/><rect x="19" y="38" width="11" height="21" rx="1"/><rect x="35" y="33" width="11" height="26" rx="1"/><rect x="51" y="24" width="11" height="35" rx="1"/><rect x="67" y="16" width="11" height="43" rx="1"/><rect x="83" y="6" width="11" height="53" rx="1"/></g><g fill="#93C5FD"><rect x="3" y="44" width="11" height="5"/><rect x="19" y="38" width="11" height="8"/><rect x="35" y="33" width="11" height="9"/><rect x="51" y="24" width="11" height="12"/><rect x="67" y="16" width="11" height="15"/><rect x="83" y="6" width="11" height="18"/></g></g>
    <g id="t-quality"><rect y="12" width="36" height="36" rx="6" fill="#15803D"/><text x="18" y="38" text-anchor="middle" font-size="24" class="b wh">A</text><g fill="#E2E8F0"><rect x="46" y="15" width="50" height="6" rx="3"/><rect x="46" y="27" width="50" height="6" rx="3"/><rect x="46" y="39" width="50" height="6" rx="3"/></g><rect x="46" y="15" width="46" height="6" rx="3" fill="#15803D"/><rect x="46" y="27" width="39" height="6" rx="3" fill="#15803D"/><rect x="46" y="39" width="27" height="6" rx="3" fill="#B45309"/></g>
    <path id="chev" d="M-4 -5l5 5-5 5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <rect width="1536" height="1024" fill="#FFFFFF"/>

  <!-- Header -->
  <use xlink:href="#logo" transform="translate(48,48) scale(2)"/>
  <text x="110" y="84" font-size="32" class="d bb" letter-spacing=".5">AGNOS</text>
  <path d="M222.500 54v36" class="hl" stroke="#CBD5E1"/>
  <text x="238" y="82" font-size="22" class="d b">Agentic efficiency by traceability</text>
  <text x="1488" y="80" font-size="13" text-anchor="end" class="su">A plugin for Claude Code and GitHub Copilot</text>
  <path d="M48 120.500h1440" class="hl"/>

  <!-- Left: promise and modes -->
  <text x="48" y="192" font-size="13" class="b ac">Engineering process for agentic AI</text>
  <text x="48" y="236" font-size="34" class="d bb">AI agents write the</text>
  <text x="48" y="276" font-size="34" class="d bb">code, or much more.</text>
  <text x="48" y="316" font-size="34" class="d bb ac">You keep control.</text>
  <text x="48" y="352" font-size="14" class="mu">A lightweight, tooled process for AI-native</text>
  <text x="48" y="372" font-size="14" class="mu">teams: pods of a few people, or solo.</text>

  <path d="M48 404.500h312" class="hl"/>
  <path d="M48 430h20" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <use xlink:href="#i-you" x="80" y="418" class="i ib"/>
  <text x="114" y="435" font-size="14" class="b">Human in the loop</text>
  <text x="48" y="460" font-size="12.500" class="mu">The agent drafts; you decide and approve</text>
  <text x="48" y="477" font-size="12.500" class="mu">each step.</text>
  <path d="M48 514h20" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <use xlink:href="#i-agent" x="80" y="502" class="i ia"/>
  <text x="114" y="519" font-size="14" class="b">Human on the loop</text>
  <text x="48" y="544" font-size="12.500" class="mu">The agent carries out the approved task;</text>
  <text x="48" y="561" font-size="12.500" class="mu">you supervise, and step in if needed.</text>
  <path d="M48 590.500h312" class="hl"/>
  <use xlink:href="#i-branch" x="48" y="608" class="i im"/>
  <text x="82" y="625" font-size="14" class="b">Work in sessions</text>
  <text x="48" y="650" font-size="12.500" class="mu">One functional area, one branch,</text>
  <text x="48" y="667" font-size="12.500" class="mu">at most 10 tasks: the context stays sharp.</text>

  <!-- Centre: the supervised loop -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M760 240A190 190 0 0 1 842.400 601.200" stroke="#2563EB"/>
    <path d="M842.400 601.200A190 190 0 0 1 611.500 311.500" stroke="#B45309"/>
    <path d="M611.500 311.500A190 190 0 0 1 760 240" stroke="#CBD5E1" stroke-dasharray="2 8"/>
  </g>
  <use xlink:href="#chev" transform="translate(945.200,387.700) rotate(77.140)" stroke="#2563EB"/>
  <use xlink:href="#chev" transform="translate(611.500,548.500) rotate(231.430)" stroke="#B45309"/>
  <use xlink:href="#chev" transform="translate(677.600,258.800) rotate(-25.710)" stroke="#94A3B8"/>

  <g transform="translate(760,430)">
    <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 5">
      <path d="M96 0h66" transform="rotate(-90)"/><path d="M96 0h66" transform="rotate(-38.570)"/><path d="M96 0h66" transform="rotate(12.860)"/><path d="M96 0h66" transform="rotate(64.290)"/><path d="M96 0h66" transform="rotate(115.710)"/><path d="M96 0h66" transform="rotate(167.140)"/><path d="M96 0h66" transform="rotate(218.570)"/>
    </g>
    <circle r="88" fill="#F8FAFC" stroke="#CBD5E1"/>
    <use xlink:href="#i-pc" transform="translate(-18,-52) scale(1.500)" class="i ib" style="stroke-width:1.17"/>
    <text y="12" font-size="16" text-anchor="middle" class="b">Performance Center</text>
    <text y="32" font-size="12" text-anchor="middle" class="mu">supervises end to end</text>
  </g>

  <g transform="translate(760,240)"><circle r="24" class="node"/><use xlink:href="#i-req" x="-12" y="-12" class="i"/></g>
  <text x="760" y="184" font-size="15" text-anchor="middle" class="b">Requirement</text>
  <text x="760" y="203" font-size="12" text-anchor="middle" class="mu">The need, formalised to be testable</text>

  <g transform="translate(908.500,311.500)"><circle r="24" class="node"/><use xlink:href="#i-dec" x="-12" y="-12" class="i"/></g>
  <text x="944" y="306" font-size="15" class="b">Architecture decision</text>
  <text x="944" y="325" font-size="12" class="mu">Why this design, and</text>
  <text x="944" y="341" font-size="12" class="mu">what was ruled out</text>

  <g transform="translate(945.200,472.300)"><circle r="24" class="node"/><use xlink:href="#i-task" x="-12" y="-12" class="i"/></g>
  <text x="981" y="468" font-size="15" class="b">Task</text>
  <text x="981" y="487" font-size="12" class="mu">Sized to the risk:</text>
  <text x="981" y="503" font-size="12" class="mu">tier S, M or L</text>

  <g transform="translate(842.400,601.200)"><circle r="24" fill="#2563EB"/><use xlink:href="#i-you" x="-12" y="-12" class="i iw"/></g>
  <text x="878" y="598" font-size="15" class="b ac">You approve</text>
  <text x="878" y="617" font-size="12" class="mu">Nothing starts without</text>
  <text x="878" y="633" font-size="12" class="mu">your approval</text>

  <g transform="translate(677.600,601.200)"><circle r="24" class="node"/><use xlink:href="#i-code" x="-12" y="-12" class="i"/></g>
  <text x="641" y="598" font-size="15" text-anchor="end" class="b">Tests, then code</text>
  <text x="641" y="617" font-size="12" text-anchor="end" class="mu">Every element cites</text>
  <text x="641" y="633" font-size="12" text-anchor="end" class="mu">its identifiers</text>

  <g transform="translate(574.800,472.300)"><circle r="24" class="node"/><use xlink:href="#i-done" x="-12" y="-12" class="i"/></g>
  <text x="538" y="468" font-size="15" text-anchor="end" class="b">Checklist passed</text>
  <text x="538" y="487" font-size="12" text-anchor="end" class="mu">Definition of Done</text>

  <g transform="translate(611.500,311.500)"><circle r="24" class="node"/><use xlink:href="#i-commit" x="-12" y="-12" class="i"/></g>
  <text x="575" y="306" font-size="15" text-anchor="end" class="b">Commit</text>
  <text x="575" y="325" font-size="12" text-anchor="end" class="mu">One per task, identifiers</text>
  <text x="575" y="341" font-size="12" text-anchor="end" class="mu">checked by a script</text>

  <!-- Right: Performance Center -->
  <text x="1136" y="196" font-size="20" class="b">Performance Center</text>
  <text x="1136" y="218" font-size="12.500" class="mu">Built in. Five views, five management questions.</text>
  <g transform="translate(1136,240)">
    <rect width="112" height="72" rx="6" class="card"/><use xlink:href="#t-matrix" x="8" y="6"/>
    <text x="128" y="20" font-size="14" class="b">Matrix</text>
    <text x="128" y="40" font-size="12.500" class="mu">Was everything we asked for</text>
    <text x="128" y="57" font-size="12.500" class="mu">actually built?</text>
  </g>
  <g transform="translate(1136,326)">
    <rect width="112" height="72" rx="6" class="card"/><use xlink:href="#t-graph" x="8" y="6"/>
    <text x="128" y="20" font-size="14" class="b">Graph</text>
    <text x="128" y="40" font-size="12.500" class="mu">Why does this code exist, and</text>
    <text x="128" y="57" font-size="12.500" class="mu">what would a change touch?</text>
  </g>
  <g transform="translate(1136,412)">
    <rect width="112" height="72" rx="6" class="card"/><use xlink:href="#t-history" x="8" y="6"/>
    <text x="128" y="20" font-size="14" class="b">History</text>
    <text x="128" y="40" font-size="12.500" class="mu">Who changed what, and when?</text>
    <text x="128" y="57" font-size="12.500" class="mu">Agent, human, or both?</text>
  </g>
  <g transform="translate(1136,498)">
    <rect width="112" height="72" rx="6" class="card"/><use xlink:href="#t-delivery" x="8" y="6"/>
    <text x="128" y="20" font-size="14" class="b">Delivery</text>
    <text x="128" y="40" font-size="12.500" class="mu">What was delivered, how fast?</text>
    <text x="128" y="57" font-size="12.500" class="mu">Is agentic velocity controlled?</text>
  </g>
  <g transform="translate(1136,584)">
    <rect width="112" height="72" rx="6" class="card"/><use xlink:href="#t-quality" x="8" y="6"/>
    <text x="128" y="20" font-size="14" class="b">Quality</text>
    <text x="128" y="40" font-size="12.500" class="mu">Is traceability guaranteed,</text>
    <text x="128" y="57" font-size="12.500" class="mu">per functional area?</text>
  </g>

  <!-- Bottom: why it holds, get started -->
  <path d="M48 704.500h1440" class="hl"/>
  <text x="48" y="740" font-size="16" class="b">Why it holds at scale</text>

  <g transform="translate(48,760)">
    <use xlink:href="#i-link" class="i ib"/>
    <text y="50" font-size="15" class="b">Exact links, never guessed</text>
    <text y="71" font-size="12.500" class="mu">Requirements, decisions, tasks,</text>
    <text y="88" font-size="12.500" class="mu">code and commits cite the same</text>
    <text y="105" font-size="12.500" class="mu">unique identifiers.</text>
    <rect y="120" width="92" height="22" rx="4" class="card"/><text x="46" y="135" font-size="10.500" text-anchor="middle" class="m">TASK-BKG-003</text>
    <text x="113" y="135" font-size="10.500" text-anchor="middle" class="su">cites</text>
    <rect x="134" y="120" width="80" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE"/><text x="174" y="135" font-size="10.500" text-anchor="middle" class="m ac">RQ-BKG-003</text>
  </g>
  <g transform="translate(296,760)">
    <use xlink:href="#i-index" class="i ib"/>
    <text y="50" font-size="15" class="b">A deterministic index</text>
    <text y="71" font-size="12.500" class="mu">One line per artifact, with its</text>
    <text y="88" font-size="12.500" class="mu">exact location. The agent and the</text>
    <text y="105" font-size="12.500" class="mu">Performance Center read the</text>
    <text y="122" font-size="12.500" class="mu">same file.</text>
  </g>
  <g transform="translate(544,760)">
    <use xlink:href="#i-gate" class="i ib"/>
    <text y="50" font-size="15" class="b">Gates agents cannot bypass</text>
    <text y="71" font-size="12.500" class="mu">Definition of Ready, Definition</text>
    <text y="88" font-size="12.500" class="mu">of Done, tiers S, M, L. A failing</text>
    <text y="105" font-size="12.500" class="mu">check gets one fix, then the</text>
    <text y="122" font-size="12.500" class="mu">agent stops and reports.</text>
  </g>
  <g transform="translate(792,760)">
    <use xlink:href="#i-cycle" class="i ib"/>
    <text y="50" font-size="15" class="b">Measured friction</text>
    <text y="71" font-size="12.500" class="mu">Four friction counters close</text>
    <text y="88" font-size="12.500" class="mu">each session. A non-zero one</text>
    <text y="105" font-size="12.500" class="mu">triggers a self-improvement</text>
    <text y="122" font-size="12.500" class="mu">step, applied once approved.</text>
  </g>

  <path d="M1048.500 724v188" class="hl"/>
  <text x="1072" y="740" font-size="16" class="b">Get started</text>
  <g transform="translate(1072,762)">
    <circle cx="12" cy="12" r="11.500" fill="none" stroke="#CBD5E1"/><text x="12" y="16.500" font-size="12" text-anchor="middle" class="m md ac">1</text>
    <text x="38" y="11" font-size="14" class="b">Install the plugin</text>
    <text x="38" y="29" font-size="12.500" class="mu">One marketplace, one plugin: agnos.</text>
  </g>
  <g transform="translate(1072,812)">
    <circle cx="12" cy="12" r="11.500" fill="none" stroke="#CBD5E1"/><text x="12" y="16.500" font-size="12" text-anchor="middle" class="m md ac">2</text>
    <text x="38" y="11" font-size="14" class="b">Add AGNOS to a project</text>
    <text x="38" y="29" font-size="12.500" class="mu">Call agnos-init once. Your files stay intact.</text>
  </g>
  <g transform="translate(1072,862)">
    <circle cx="12" cy="12" r="11.500" fill="none" stroke="#CBD5E1"/><text x="12" y="16.500" font-size="12" text-anchor="middle" class="m md ac">3</text>
    <text x="38" y="11" font-size="14" class="b">Start a session</text>
    <text x="38" y="29" font-size="12.500" class="mu">Give a trigram; the agent opens the branch.</text>
  </g>

  <path d="M48 928.500h1440" class="hl"/>
  <text x="48" y="957" font-size="12.500" class="mu"><tspan class="b" fill="#0F172A">Works with</tspan> Claude Code and GitHub Copilot (OpenAI Codex coming soon)</text>
  <text x="1488" y="957" font-size="12.500" text-anchor="end" class="mu">Markdown artifacts, versioned in git  ·  Any language, any stack  ·  Open source, GNU AGPL v3</text>
</svg>
